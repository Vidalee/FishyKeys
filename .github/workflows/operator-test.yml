name: Operator Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run on Ubuntu
    runs-on: namespace-profile-vidalee

    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Go cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache: false  # handled by nscloud-cache-action above

      - name: Running Tests
        working-directory: operator
        run: |
          go mod tidy
          make test
